[package]
name = "postman-client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "postman_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tauri-plugin-log = "2"
# reqwest: mature async HTTP/1.1+HTTP/2 client with TLS, streaming bodies, per-request
# timeouts and proxy support — chosen over hyper (too low-level, would mean reimplementing
# redirects/TLS/proxy) and over blocking clients like ureq (would block the async runtime).
# rustls instead of the default native-tls avoids an OpenSSL system dependency on Linux.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# Needed directly (not just transitively via reqwest/tauri) for task::spawn + AbortHandle
# (request cancellation) and async file IO (large-response disk spillover).
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
# StreamExt::next() to consume reqwest's bytes_stream() chunk-by-chunk for bounded buffering.
futures-util = { version = "0.3", default-features = false, features = ["std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
